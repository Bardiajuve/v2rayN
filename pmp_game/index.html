<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PMP City: مأموریت موفقیت</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header>
    <h1 id="project-title"></h1>
    <div id="process-group"></div>
  </header>
  <section id="narrative"></section>
  <div id="options"></div>
  <aside id="kpis">
    <h3>شاخص‌ها</h3>
    <ul>
      <li>بودجه: <span id="kpi-budget">0</span></li>
      <li>زمان: <span id="kpi-schedule">0</span></li>
      <li>کیفیت: <span id="kpi-quality">0</span></li>
      <li>ریسک: <span id="kpi-risk">0</span></li>
      <li>رضایت ذینفعان: <span id="kpi-stakeholder">0</span></li>
    </ul>
  </aside>
</div>
<div id="feedback" class="hidden">
  <h2>نتیجه تصمیم شما</h2>
  <p id="feedback-text"></p>
  <button id="continue-btn">ادامه</button>
</div>
<script src="js/app.js"></script>
</body>
</html>
